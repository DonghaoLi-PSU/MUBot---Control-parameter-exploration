# ros_gz_bridge parameter_bridge configuration.
# GaitCmd and ActuatorState are custom messages: mubot_gz_cmd_bridge handles them.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /mubot/imu
  gz_topic_name: /mubot/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /mubot/range
  gz_topic_name: /mubot/range
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS

- ros_topic_name: /mubot/camera/camera_info
  gz_topic_name: /mubot/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

# Images go through ros_gz_image (image_bridge) for performance; this entry is
# the fallback if image_bridge is not used.
- ros_topic_name: /mubot/camera/image_raw
  gz_topic_name: /mubot/camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /model/mubot/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /mubot/odom
  gz_topic_name: /model/mubot/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /mubot/estop
  gz_topic_name: /model/mubot/estop
  ros_type_name: std_msgs/msg/Bool
  gz_type_name: gz.msgs.Boolean
  direction: ROS_TO_GZ
